name: CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
      - 3.2.7
  pull_request:
    branches:
      - main
      - master
      - develop
      - 3.2.7

env:
  JAVA_VERSION: '11'
  MAVEN_OPTS: -Xmx2048m -XX:+TieredCompilation -XX:TieredStopAtLevel=1 -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Build and test
        run: ./mvnw package -Pci -T 2C -B -s .mvn/settings.xml

      - name: Extract version
        id: version
        run: echo "version=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout -pl sm-shop)" >> $GITHUB_OUTPUT

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: shopizer-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: sm-shop/target/shopizer.jar
          retention-days: 90
          compression-level: 0

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.sha }}
          path: '**/target/surefire-reports/**'
          retention-days: 7
