name: CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
      - 3.2.7
  pull_request:
    branches:
      - main
      - master
      - develop
      - 3.2.7

env:
  JAVA_VERSION: '11'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/shopizer

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Run all tests against a real MySQL service container
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: SALESMANAGER
          MYSQL_USER: app_user
          MYSQL_PASSWORD: app_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root --password=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run tests
        run: |
          ./mvnw test \
            -Dspring.profiles.active=mysql \
            -Dspring.datasource.url=jdbc:mysql://127.0.0.1:3306/SALESMANAGER?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC \
            -Dspring.datasource.username=app_user \
            -Dspring.datasource.password=app_password \
            --batch-mode \
            --no-transfer-progress

      - name: Upload Surefire test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Build fat JAR + Docker image — only on push to main/master
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build & Publish
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    permissions:
      contents: read
      packages: write   # required to push to ghcr.io

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build fat JAR (skip tests)
        run: |
          ./mvnw package -DskipTests -pl sm-shop -am \
            --batch-mode \
            --no-transfer-progress

      - name: Upload shopizer.jar as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: shopizer-jar-${{ github.sha }}
          path: sm-shop/target/shopizer.jar
          retention-days: 30

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=true

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./sm-shop
          file: ./sm-shop/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
