#Spring boot configurations
server.port=8080

# Load shopizer properties
spring.config.import=optional:classpath:shopizer-properties.properties

# H2 Database for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;INIT=CREATE SCHEMA IF NOT EXISTS SALESMANAGER
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Database properties for DataConfiguration
db.jdbcUrl=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;INIT=CREATE SCHEMA IF NOT EXISTS SALESMANAGER
db.user=sa
db.password=
db.driverClass=org.h2.Driver
hibernate.dialect=org.hibernate.dialect.H2Dialect
db.show.sql=false
db.schema=SALESMANAGER
hibernate.hbm2ddl.auto=create-drop
db.preferredTestQuery=SELECT 1
db.initialPoolSize=1
db.minPoolSize=1
db.maxPoolSize=5

#default database schema
spring.jpa.properties.hibernate.default_schema=SALESMANAGER

# JWT Configuration
jwt.secret=testSecretKey123456789012345678901234567890
jwt.expiration=86400
authToken.header=Authorization

logging.level.root=ERROR
logging.level.org.springframework=ERROR
logging.level.org.springframework.test=ERROR
logging.level.org.springframework.boot=ERROR
logging.level.com.shopizer=ERROR
logging.level.org.hibernate=ERROR
logging.level.org.apache.http=ERROR
logging.level.com.zaxxer.hikari=ERROR
logging.level.org.apache.catalina=ERROR
logging.level.org.apache.jasper=ERROR
logging.level.com.salesmanager=ERROR

#Default Spring white label error page
server.error.whitelabel.enabled=false

spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=10MB

#Spring boot 2.X
spring.main.allow-bean-definition-overriding=true

#actuator
management.endpoints.enabled-by-default=false
management.endpoint.info.enabled=true
management.endpoint.health.enabled=true
management.endpoint.health.sensitive=false
management.endpoint.health.show-details=always

management.health.probes.enabled=true

management.endpoint.health.group.global.include=ping
management.security.enabled=false

#disable search indexing for tests
search.noindex=true

#disable elasticsearch health check and initialization for tests
management.health.elasticsearch.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration,org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration

spring.main.banner-mode=off
logging.pattern.console=