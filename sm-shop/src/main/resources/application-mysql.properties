##
## MySQL datasource properties - loaded when spring.profiles.active=mysql
## These feed the @Value annotations in DataConfiguration
##

db.jdbcUrl=jdbc:mysql://localhost:3306/SALESMANAGER?autoReconnect=true&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
db.user=app_user
db.password=app_password
db.driverClass=com.mysql.cj.jdbc.Driver
hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

db.show.sql=false
db.schema=SALESMANAGER
hibernate.hbm2ddl.auto=update

db.preferredTestQuery=SELECT 1

##
## db pool settings
##
db.initialPoolSize=3
db.minPoolSize=1
db.maxPoolSize=10
