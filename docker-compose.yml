# ─────────────────────────────────────────────────────────────────────────────
# MOVED
#
# The docker-compose.yml for the full Shopizer stack (backend + admin UI +
# React shop + MySQL) has been moved to the shopizer-infra repository:
#
#   shopizer-infra/docker-compose.yml
#
# To run the full stack locally:
#
#   1. Build each image (from your local repo roots):
#        cd ../shopizer              && ./build-image-from-ci.sh <owner> shopizer
#        cd ../shopizer-admin        && ./build-image-from-ci.sh <owner> shopizer-admin
#        cd ../shopizer-shop-reactjs && ./build-image-from-ci.sh <owner> shopizer-shop-reactjs
#
#   2. Start all services:
#        cd ../shopizer-infra && docker compose up -d
#
# See shopizer-infra/README.md for full documentation.
# ─────────────────────────────────────────────────────────────────────────────
